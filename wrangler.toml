# Cloudflare Pages project — the-loaded-scone.pages.dev
# `npm run build` (Astro) produces dist/; Pages publishes that directory.
# Pages serves dist/404.html for unmatched paths and resolves /menu/ to
# dist/menu/index.html automatically, so no extra routing config is needed.
name = "the-loaded-scone"
compatibility_date = "2026-09-07"
pages_build_output_dir = "dist"

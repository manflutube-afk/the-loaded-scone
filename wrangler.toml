# Workers project serving Astro's build output as static assets.
# `npm run build` produces dist/; `wrangler deploy` uploads it.
name = "the-loaded-scone"
compatibility_date = "2026-09-07"

[assets]
directory = "./dist"
# Serve dist/404.html for anything that doesn't match a file.
not_found_handling = "404-page"
# /menu/ resolves to dist/menu/index.html.
html_handling = "auto-trailing-slash"

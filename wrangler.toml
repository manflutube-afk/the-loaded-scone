# Workers project with static assets (not Cloudflare Pages).
# Everything in public/ is served directly; there is no Worker script.
name = "the-loaded-scone"
compatibility_date = "2026-09-07"

[assets]
directory = "./public"
# Serve public/404.html for anything that doesn't match a file.
not_found_handling = "404-page"
# /menu/ resolves to public/menu/index.html, /404 to public/404.html.
html_handling = "auto-trailing-slash"
